<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0eb" />
    <meta name="description" content="考えごとを一度手放すための、茜の外付けワーキングメモリ。" />
    <title>置いとく。</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="置いとく。" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">外付けワーキングメモリ</p>
        <h1>置いとく。</h1>
        <p class="lead">考えなくていい。ここに置いて。</p>
      </header>

      <form id="capture-form" class="capture" autocomplete="off">
        <label class="sr-only" for="dump-input">頭にあることをそのまま入力</label>
        <textarea
          id="dump-input"
          rows="3"
          placeholder="いま頭にあることを、そのまま。"
          enterkeyhint="send"
          autofocus
        ></textarea>
        <div class="capture-footer">
          <span class="privacy">この端末の中だけに保存</span>
          <button class="primary" type="submit">置く</button>
        </div>
      </form>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <section class="resume-section" aria-labelledby="resume-title">
        <div class="section-heading">
          <p class="section-kicker">今はこれだけ。</p>
          <h2 id="resume-title">ここから戻る</h2>
        </div>
        <div id="resume-card"></div>
      </section>

      <section id="deadline-section" class="deadline-section" aria-labelledby="deadline-title" hidden>
        <h2 id="deadline-title">近いもの</h2>
        <div id="deadline-list"></div>
      </section>

      <details id="shopping-details" class="shopping" hidden>
        <summary>
          <span>買い物</span>
          <span id="shopping-count" class="count">0</span>
        </summary>
        <div id="shopping-list" class="shopping-list"></div>
      </details>

      <details id="feelings-details" class="feelings" hidden>
        <summary>
          <span>気持ちを置いたもの</span>
          <span id="feelings-count" class="count">0</span>
        </summary>
        <div id="feelings-list" class="feelings-list"></div>
      </details>

      <details id="stored-details" class="stored">
        <summary>
          <span>置いといたもの</span>
          <span id="stored-count" class="count">0</span>
        </summary>
        <div id="stored-list" class="stored-list"></div>
      </details>

      <footer>
        管理能力を強くするのではなく、<br />管理しなくて済む範囲を増やす。
      </footer>
    </main>

    <template id="empty-resume-template">
      <div class="resume-card empty">
        <span class="soft-orb" aria-hidden="true"></span>
        <p>まだありません</p>
        <small>「今は〜していて、次に〜」も、そのまま置けます。</small>
      </div>
    </template>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
